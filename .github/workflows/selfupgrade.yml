name: selfupgrade

# Self-upgrade setiap 10 minit (literal */10): bot audit rendaman skill sendiri, tambah domain baharu ke senarai
# autolearn, dan pastikan config/SOUL/AGENTS sihat. Push ke home repo.
# Berjalan setiap 10 minit — audit diri + perkaya skill, sama enjin dengan evolve.yml.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: selfupgrade
  cancel-in-progress: false

jobs:
  naik-taraf:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ambil home Hermes
        run: |
          git clone --depth 1 "https://x-access-token:${{ secrets.BOZ_PAT }}@github.com/Solelyy4/boz-hermes-home.git" home
          cd home
          git config user.email bot@local
          git config user.name boz-bot

      - name: Pasang kebergantungan
        run: python -m pip install --quiet pyyaml 2>&1 | tail -2

      - name: Audit + naik taraf
        env:
          BOZ_PAT: ${{ secrets.BOZ_PAT }}
        run: |
          export HERMES_HOME="$PWD/home"
          python "$PWD/scripts_evolve.py"

      - name: Commit & push
        run: |
          cd home
          rm -f .env
          git add -A
          git commit -m "selfupgrade $(date -u +%FT%TZ)" || echo "tiada perubahan"
          for p in 1 2 3 4; do
            git fetch origin master -q >/dev/null 2>&1 || true
            git rebase -X ours origin/master >/dev/null 2>&1 || git rebase --abort >/dev/null 2>&1 || true
            if git push origin HEAD:master >/dev/null 2>&1; then echo "push ok"; break; fi
            sleep $((3 + p * 3))
          done
