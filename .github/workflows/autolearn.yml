name: autolearn

# Auto-evolusi bot BOZ: setiap jam, bot sendiri cari ilmu + tulis skill baharu + push.
# Tiada campur tangan BOZ. Setiap jam: pilih domain, riset, tulis skill, push ke home repo.

on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:
    inputs:
      domain:
        description: "Domain khusus (kosong = auto pilih)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: autolearn
  cancel-in-progress: false

jobs:
  belajar:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ambil home Hermes
        run: |
          git clone --depth 1 "https://x-access-token:${{ secrets.BOZ_PAT }}@github.com/Solelyy4/boz-hermes-home.git" home
          cd home
          git config user.email bot@local
          git config user.name boz-bot
          ls

      - name: Pasang Hermes
        run: |
          python -m pip install -U pip wheel >/dev/null
          pip install --quiet hermes-agent 2>&1 | tail -2

      - name: Tulis .env
        run: |
          cat > home/.env <<'EOF'
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_USERS=8043910371
          MISTRAL_API_KEY=${{ secrets.MISTRAL_API_KEY }}
          GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
          BOZ_PAT=${{ secrets.BOZ_PAT }}
          BOZ_USER=Solelyy4
          EOF
          sed -i 's/^ *//' home/.env

      - name: Pilih domain giliran
        id: pilih
        run: |
          export HERMES_HOME="$PWD/home"
          DOMAIN="${{ github.event.inputs.domain }}"
          if [ -z "$DOMAIN" ]; then
            python - <<'PY'
          import json, os, pathlib
          f = pathlib.Path("home/state/autolearn.json")
          d = json.loads(f.read_text()) if f.exists() else {"i": 0, "done": []}
          domains = [
            "web-exploit-advanced", "smart-contract-deep", "osint-full-stack",
            "malware-evasion-modern", "cloud-privesc-aws-gcp-azure", "mobile-android-ios",
            "social-engineering-modern", "crypto-onchain-forensics", "ai-prompt-injection",
            "network-protocol-attacks", "windows-ad-attack-paths", "linux-privesc-modern",
            "api-graphql-abuse", "supply-chain-attack", "browser-extension-abuse",
            "container-k8s-escape", "wireless-attacks", "firmware-iot",
            "data-engineering-pipelines", "devops-cicd-abuse",
            "reverse-engineering-binary", "steganography-forensics", "phishing-modern-kits",
            "bug-bounty-methodology", "report-writing-evidence",
          ]
          dom = domains[d["i"] % len(domains)]
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
            fh.write(f"domain={dom}\n")
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
            fh.write(f"idx={d['i']}\n")
          PY
          else
            echo "domain=$DOMAIN" >> "$GITHUB_OUTPUT"
            echo "idx=manual" >> "$GITHUB_OUTPUT"
          fi
          echo "giliran: $(grep '^domain=' "$GITHUB_OUTPUT" | cut -d= -f2)"

      - name: Riset + tulis skill
        continue-on-error: true
        run: |
          export HERMES_HOME="$PWD/home"
          export HERMES_NO_UPDATE_CHECK=1
          DOM="${{ steps.pilih.outputs.domain }}"
          mkdir -p home/skills
          hermes -z "Kau BOZ-AGENT mod auto-belajar. Tugasan: hasilkan SATU skill baharu dalam BM+Inggeris teknikal untuk domain '$DOM'.
          Langkah: (1) guna web_search/web_extract untuk cari 5-8 teknik/tool/link TERKINI dan nyata dalam domain ini; (2) tulis skill ringkas: frontmatter (name: $DOM, description 1 baris), 'When to Use', 8-15 langkah/teknik imperatif dengan arahan tool sebenar; (3) guna skill_manage(action='create') untuk SIMPAN skill itu dalam profil ini (name='$DOM'); (4) sahkan fail wujud dengan skill_view('$DOM'); (5) cetak blok akhir: SKILL-SAVED name='$DOM' bytes=N.
          Jangan bagi esei. Buat terus." > auto.log 2>&1 || true
          tail -40 auto.log
          echo "=== skill ditulis ==="
          ls home/skills/ | wc -l

      - name: Simpan skill + naikkan penunjuk
        run: |
          export HERMES_HOME="$PWD/home"
          export AUTODOM="${{ steps.pilih.outputs.domain }}"
          cd home
          mkdir -p state
          python - <<'PY'
          import json, os, pathlib
          f = pathlib.Path("state/autolearn.json")
          d = json.loads(f.read_text()) if f.exists() else {"i": 0, "done": []}
          dom = os.environ.get("AUTODOM", "")
          d["i"] = d.get("i", 0) + 1
          if dom:
              d.setdefault("done", []).append({"t": "auto", "domain": dom})
              d["done"] = d["done"][-200:]
          f.write_text(json.dumps(d, ensure_ascii=False, indent=1))
          print("penunjuk:", d["i"], "| domain selesai:", len(d.get("done", [])))
          PY
          rm -f .env
          git add -A
          git commit -m "autolearn #$(date -u +%FT%TZ) domain=${AUTODOM}" || echo "tiada perubahan"
          git pull --rebase -X ours || true
          git push origin HEAD:master || echo "push gagal"
