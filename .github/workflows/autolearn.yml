name: autolearn

# Auto-evolusi bot BOZ: setiap jam, bot cari ilmu, tulis skill baharu, push ke repo.
# Deterministik (tiada agent agentic yang boleh habis iterasi).

on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:
    inputs:
      domain:
        description: "Domain khusus (kosong = auto pilih)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: autolearn
  cancel-in-progress: false

jobs:
  belajar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ambil home Hermes
        run: |
          git clone --depth 1 "https://x-access-token:${{ secrets.BOZ_PAT }}@github.com/Solelyy4/boz-hermes-home.git" home
          cd home
          git config user.email bot@local
          git config user.name boz-bot

      - name: Riset + tulis skill (deterministik)
        env:
          DOMAIN_INPUT: ${{ github.event.inputs.domain }}
        run: |
          export HERMES_HOME="$PWD/home"
          python scripts_autolearn.py

      - name: Commit & push
        run: |
          cd home
          rm -f .env
          git add -A
          git commit -m "autolearn $(date -u +%FT%TZ)" || echo "tiada perubahan"
          git pull --rebase -X ours || true
          git push origin HEAD:master || echo "push gagal"
          echo "=== jumlah skill ==="
          ls skills | wc -l
