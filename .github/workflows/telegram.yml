name: telegram-hermes

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: telegram-hermes
  cancel-in-progress: false

jobs:
  jalankan:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ambil home Hermes (repo peribadi)
        run: |
          git clone --depth 1 "https://x-access-token:${{ secrets.BOZ_PAT }}@github.com/Solelyy4/boz-hermes-home.git" home
          ls home

      - name: Pasang Hermes
        run: |
          python -m pip install -U pip wheel >/dev/null
          pip install --quiet hermes-agent playwright 2>&1 | tail -3
          which hermes || python -m hermes_cli --version || true

      - name: Pasang pelayar (Playwright Chromium)
        continue-on-error: true
        run: |
          python -m playwright install --with-deps chromium 2>&1 | tail -3
          python -c "from playwright.sync_api import sync_playwright; print('playwright ok')"

      - name: Tulis .env
        run: |
          cat > home/.env <<'EOF'
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_USERS=8043910371
          MISTRAL_API_KEY=${{ secrets.MISTRAL_API_KEY }}
          GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
          BOZ_PAT=${{ secrets.BOZ_PAT }}
          BOZ_USER=Solelyy4
          EOF
          sed -i 's/^ *//' home/.env

      - name: Jalankan gateway + lapor status
        timeout-minutes: 330
        continue-on-error: true
        run: |
          export HERMES_HOME="$PWD/home"
          export HERMES_NO_UPDATE_CHECK=1
          lapor() {
            cp gw.log status.log 2>/dev/null || true
            echo "$1 $(date -u +%FT%TZ)" >> status.log
            git add status.log && git -c user.email=bot@local -c user.name=bot commit -qm "status $1 $(date -u +%FT%TZ)" || true
            git push || true
          }
          for cubaan in 1 2 3 4 5 6 7 8; do
            MARK=$(wc -l < gw.log 2>/dev/null || echo 0)
            # bunuh sisa gateway lama (anak proses boleh hidup walaupun induk mati -> rebutan getUpdates)
            pkill -9 -f "hermes gateway" 2>/dev/null || true
            sleep 5
            hermes gateway run >> gw.log 2>&1 &
            PID=$!
            for i in $(seq 1 36); do
              sleep 5
              if tail -n +$((MARK+1)) gw.log | grep -qiE "telegram"; then break; fi
              kill -0 $PID 2>/dev/null || break
            done
            tail -20 gw.log
            lapor "mula-cubaan-$cubaan"
            tick=0
            while kill -0 $PID 2>/dev/null; do
              sleep 60
              tick=$((tick+1))
              # gateway boleh kekal hidup walaupun Telegram mati (fatal adapter) -> paksa mula semula
              if tail -n +$((MARK+1)) gw.log | grep -q "Fatal telegram adapter error"; then
                echo "fatal dikesan, mula semula"
                pkill -9 -f "hermes gateway" 2>/dev/null || true
                break
              fi
              if [ $((tick % 10)) -eq 0 ]; then lapor "denyut"; fi
            done
            wait $PID 2>/dev/null || true
            lapor "gateway-berhenti-cubaan-$cubaan"
            sleep 30
          done
          tail -60 gw.log

      - name: Hantar log akhir ke repo
        if: always()
        run: |
          cp gw.log status.log 2>/dev/null || echo "tiada gw.log" > status.log
          git add status.log && git -c user.email=bot@local -c user.name=bot commit -qm "status akhir $(date -u +%FT%TZ)" || true
          git push || true

      - name: Simpan state ke repo peribadi
        if: always()
        run: |
          cd home
          git config user.email bot@local
          git config user.name boz-bot
          rm -f .env
          git add -A
          git commit -m "state $(date -u +%FT%TZ)" || echo "tiada perubahan"
          git push origin HEAD:master || echo "push gagal"
