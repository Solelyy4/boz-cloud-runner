name: telegram-hermes

on:
  schedule:
    - cron: "13 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: telegram-hermes
  # JANGAN tukar ke true. `true` bermakna setiap run/dispatch baharu MEMBUNUH bot yang
  # sedang hidup. Sejarah: 10 run berturut-turut `cancelled` dalam satu sesi kerana
  # operator mengulang dispatch untuk "restart" — bot tidak pernah sempat membalas.
  # Dengan `false`, run baharu MENUNGGU giliran; bot kekal hidup sepanjang hari.
  cancel-in-progress: false

jobs:
  jalankan:
    runs-on: ubuntu-latest
    timeout-minutes: 1440
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ambil home Hermes (repo peribadi)
        run: |
          git clone --depth 1 "https://x-access-token:${{ secrets.BOZ_PAT }}@github.com/Solelyy4/boz-hermes-home.git" home
          ls home

      - name: Pasang Hermes
        run: |
          # CARA RASMI: `pip install hermes-agent` dan `pip install git+...` KEDUA-DUANYA
          # disekat oleh reka bentuk Hermes ("Building wheels or sdists for hermes-agent is
          # not supported" — disahkan pada runner ini). PyPI pula berhenti pada 0.19.0,
          # manakala laptop BOZ yang BEKERJA guna v0.22.6 (2026.9.24) dari git.
          # Penyelesaian rasmi = skrip bootstrap install.sh (clone + uv + venv sendiri).
          set +e
          curl -fsSL https://raw.githubusercontent.com/NousResearch/hermes-agent/main/scripts/install.sh -o /tmp/h-install.sh
          if [ ! -s /tmp/h-install.sh ]; then
            echo "cetakan gagal, cuba melalui git clone"
            git clone --depth 1 https://github.com/NousResearch/hermes-agent.git /tmp/ha
            cp /tmp/ha/scripts/install.sh /tmp/h-install.sh
          fi
          chmod +x /tmp/h-install.sh 2>/dev/null
          HERMES_HOME="$PWD/home" HERMES_INSTALL_CHANNEL=stable bash /tmp/h-install.sh --non-interactive 2>&1 | tail -25
          set -e
          export PATH="$HOME/.local/bin:$PATH"
          # install.sh menamatkan dengan mesej "no dependency environment is committed for this
          # install; run `hermes pm repair`" — venv belum dipautkan. Jalankan pembaikan itu,
          # kalau tidak semua langkah berikutnya gagal dengan 'hermes: command not found'.
          hermes pm repair 2>&1 | tail -8 || true
          hermes pm install 2>&1 | tail -8 || true
          echo "--- versi dipasang ---"
          hermes --version 2>&1 | head -3 || echo "AMARAN: CLI hermes tidak dijumpai"

      - name: Bypass guardrail Hermes (patch cloud)
        run: |
          # Bot cloud berjalan dengan guardrail ASAL Hermes kerana apply_patches.py hanya
          # pernah dijalankan di laptop. Tanpa langkah ini, threat scanner, skill install guard,
          # terminal hardline, file deny-glob dan env blocklist tetap menyekat tugasan BOZ.
          export HERMES_HOME="$PWD/home"
          export PATH="$HOME/.local/bin:$PATH"

          # Venv Hermes dibina oleh install.sh di home/installs/*/environments/*/venv.
          # PENTING: mesti guna python venv itu, bukan python3 sistem — patch menulis
          # sitecustomize.py ke site-packages python yang menjalankan skrip.
          PY=""
          for cand in "$HERMES_HOME"/installs/*/environments/*/venv/bin/python; do
            [ -x "$cand" ] || continue
            if "$cand" -c "import hermes_cli" 2>/dev/null; then PY="$cand"; break; fi
          done
          if [ -z "$PY" ]; then
            echo "::error::venv Hermes tidak dijumpai — patch tidak dapat dijalankan"
            exit 1
          fi
          echo "python dipakai: $PY"
          "$PY" -c "import sys; print('site-packages:', [p for p in sys.path if 'site-packages' in p][:2])"

          echo "=== TERAP PATCH ==="
          set +e
          "$PY" scripts/apply_patches.py 2>&1 | tail -45
          PATCH_RC=$?
          set -e
          echo "patch exit: $PATCH_RC"

          echo "=== VERDICT ==="
          VERDICT=$("$PY" scripts/apply_patches.py --check 2>&1 | grep -E "^RESULT:" || echo "RESULT: TIDAK TERBACA")
          echo "$VERDICT"
          PASS=$(  "$PY" scripts/apply_patches.py --check 2>&1 | grep -c "\[PASS\]" || echo 0)
          FAIL=$(  "$PY" scripts/apply_patches.py --check 2>&1 | grep -c "\[FAIL\]" || echo 0)
          echo "PASS=$PASS FAIL=$FAIL"

          # Sahkan sitecustomize benar-benar wujud dalam venv ini
          SP=$("$PY" -c "import sys;print([p for p in sys.path if 'site-packages' in p][0])")
          if [ -f "$SP/sitecustomize.py" ]; then
            echo "sitecustomize: WUJUD di $SP"
          else
            echo "::error::sitecustomize TIDAK wujud di $SP — bypass tidak aktif"
            exit 1
          fi

          if [ "$FAIL" -gt 0 ]; then
            echo "::error::$FAIL komponen GAGAL dilempar"
            exit 1
          fi
          echo "GUARDRAIL BYPASS AKTIF ($PASS komponen PASS)"

      - name: Sahkan pelayar (Playwright Chromium)
        # install.sh Hermes sudah memasang chromium + venv sendiri (disahkan: "✓ chromium").
        # Jangan jalankan `python -m playwright install` — ia guna Python sistem yang tidak
        # ada playwright, lalu gagal dan (dengan `bash -e`) membunuh seluruh run.
        run: |
          hermes --version | head -1
          echo "pelayar diuruskan oleh venv Hermes (install.sh)"

      - name: Sahkan akses luar (web_search, web_extract, curl)
        # TIDAK kritikal: probe ini melaporkan keupayaan, bukan menghalang bot.
        # Run sebelum ini mati kerana exit 1 di sini — bot tidak pernah mula.
        continue-on-error: true
        run: |
          export HERMES_HOME="$PWD/home"
          export PATH="$HOME/.local/bin:$PATH"
          PY=""
          for cand in "$HERMES_HOME"/installs/*/environments/*/venv/bin/python; do
            [ -x "$cand" ] && "$cand" -c "import hermes_cli" 2>/dev/null && { PY="$cand"; break; }
          done
          [ -n "$PY" ] || { echo "::warning::venv tidak dijumpai"; exit 0; }
          export ROUTER9_API_KEY="${{ secrets.ROUTER9_API_KEY }}"
          # Untuk ujian tool-calling di bawah (guna API awam, bukan IP awam laptop).
          export MISTRAL_API_KEY="${{ secrets.MISTRAL_API_KEY }}"
          echo "python: $PY"

          echo "=== curl keluar ==="
          curl -s -o /dev/null -w "example.com HTTP %{http_code}\n" -m 20 https://example.com || echo "curl gagal"

          echo "=== web_search (melalui hermes tools) ==="
          cd "$HERMES_HOME/.." 2>/dev/null || true
          "$PY" - <<'PYEOF' || echo "probe web_search gagal (tidak kritikal)"
          import sys
          try:
              from tools.web_tools import web_search as _ws
              print("import ok")
          except Exception as e:
              print("import hermes_cli.tools.web_tools gagal:", type(e).__name__, str(e)[:150])
              sys.exit(0)
          try:
              r = _ws("python asyncio tutorial", 3)
              web = (r.get("data") or {}).get("web") or []
              print("hasil:", len(web))
              for x in web[:2]:
                  print("  -", str(x.get("title",""))[:60], "|", str(x.get("url",""))[:60])
          except Exception as e:
              print("panggilan gagal:", type(e).__name__, str(e)[:200])
          PYEOF
          # Ujian tool-calling: guna API AWAM (Mistral), bukan IP awam laptop.
          # IP awam laptop (129.221.178.149:20128) rapuh — laptop tidur/IP berubah/port
          # tertutup menjadikan ujian ini gagal palsu dan menyembunyikan keadaan sebenar.
          echo "=== ujian tool-calling (Mistral awam) ==="
          curl -s -m 60 -X POST https://api.mistral.ai/v1/chat/completions \
            -H "Authorization: Bearer $MISTRAL_API_KEY" -H "Content-Type: application/json" \
            -d '{"model":"ministral-8b-latest","max_tokens":150,"tools":[{"type":"function","function":{"name":"web_search","description":"Cari internet","parameters":{"type":"object","properties":{"query":{"type":"string"}},"required":["query"]}}}],"messages":[{"role":"user","content":"Cari berita AI. Guna alat."}]}' \
            | head -c 400 || echo "tool-calling gagal"

          echo "=== ujian web_search dalam venv ==="
          "$PY" - <<'PYEOF' || echo "web_search gagal (tidak kritikal)"
          import asyncio
          try:
              from plugins.web.ddgs.provider import DDGSWebSearchProvider
              p = DDGSWebSearchProvider()
              res = p.search("python asyncio", 3)
              print("ddgs hasil:", len(res))
          except Exception as e:
              print("ddgs GAGAL:", type(e).__name__, str(e)[:180])
          PYEOF


      - name: Pasang pakej web (ddgs) ke venv Hermes
        continue-on-error: true
        run: |
          export HERMES_HOME="$PWD/home"
          PY=""
          for cand in "$HERMES_HOME"/installs/*/environments/*/venv/bin/python; do
            [ -x "$cand" ] && "$cand" -c "import hermes_cli" 2>/dev/null && { PY="$cand"; break; }
          done
          [ -n "$PY" ] || { echo "::warning::venv tiada"; exit 0; }
          echo "python: $PY"
          # Backend web_search 'ddgs' memerlukan pakej PyPI `ddgs` — tanpa ia gating
          # melaporkan "ddgs package is not installed" dan carian pulang 0 hasil.
          "$PY" -m pip install --quiet --disable-pip-version-check ddgs 2>&1 | tail -5 || \
            "$PY" -m ensurepip --upgrade >/dev/null 2>&1 && "$PY" -m pip install --quiet ddgs 2>&1 | tail -3
          "$PY" -c "import ddgs; print('ddgs versi:', getattr(ddgs, '__version__', 'ADA'))" || echo "ddgs masih tiada"

      - name: Uji alat web dalam venv (tulis hasil ke repo)
        continue-on-error: true
        run: |
          export HERMES_HOME="$PWD/home"
          export PATH="$HOME/.local/bin:$PATH"
          PY=""
          for cand in "$HERMES_HOME"/installs/*/environments/*/venv/bin/python; do
            [ -x "$cand" ] && "$cand" -c "import hermes_cli" 2>/dev/null && { PY="$cand"; break; }
          done
          [ -n "$PY" ] || { echo "::warning::venv tiada"; exit 0; }

          OUT=alat_verdict.txt
          echo "=== $(date -u +%FT%TZ) ===" > $OUT
          echo "python: $PY" >> $OUT

          echo "--- 0. pasang pakej ddgs ke python ini ---" >> $OUT
          timeout 120 "$PY" -m pip install --quiet --disable-pip-version-check ddgs >> $OUT 2>&1 || \
            timeout 120 "$PY" -m ensurepip --upgrade >> $OUT 2>&1 && \
            timeout 120 "$PY" -m pip install --quiet ddgs >> $OUT 2>&1 || true
          "$PY" -c "import ddgs; print('ddgs ADA versi', getattr(ddgs,'__version__','?'))" >> $OUT 2>&1 || echo "ddgs MASIH TIADA" >> $OUT

          echo "--- 1. GATE: check_web_api_key() + registry ---" >> $OUT
          timeout 90 "$PY" - >> $OUT 2>&1 <<'PYEOF' || echo "EXIT=$?" >> $OUT
          import sys, traceback
          try:
              from tools.web_tools import check_web_api_key, _get_search_backend, _configured_backend, _keyless_backend
              print("check_web_api_key():", check_web_api_key())
              print("_configured_backend():", _configured_backend())
              print("_get_search_backend():", _get_search_backend())
              print("_keyless_backend():", _keyless_backend())
          except Exception as e:
              print("GATE GAGAL:", type(e).__name__, str(e)[:300]); traceback.print_exc()

          # adakah tool benar-benar didaftar?
          try:
              import tools.web_tools as wt
              import agent.tool_registry as tr
              reg = getattr(tr, "registry", None) or getattr(wt, "registry", None)
              names = []
              if reg is not None:
                  for attr in ("list_tools", "tools", "_tools"):
                      v = getattr(reg, attr, None)
                      if callable(v):
                          try: names = [t if isinstance(t, str) else getattr(t, "name", "") for t in v()]; break
                          except Exception: pass
                      elif isinstance(v, dict):
                          names = list(v.keys()); break
              print("web tools didaftar:", sorted(n for n in names if "web" in str(n)))
          except Exception as e:
              print("semak registry GAGAL:", type(e).__name__, str(e)[:200])

          # panggil handler sebenar seperti agent
          try:
              from tools.web_tools import web_search_tool
              r = web_search_tool("python asyncio", limit=3)
              d = r if isinstance(r, dict) else {}
              web = (d.get("data") or {}).get("web") or []
              print("web_search_tool OK, hasil:", len(web))
              for x in web[:2]:
                  print("  -", str(x.get("title",""))[:55], "|", str(x.get("url",""))[:55])
          except Exception as e:
              print("web_search_tool GAGAL:", type(e).__name__, str(e)[:300]); traceback.print_exc()
          PYEOF

          echo "--- 1b. dalaman web_search_tool ---" >> $OUT
          timeout 90 "$PY" - >> $OUT 2>&1 <<'PYEOF' || echo "EXIT=$?" >> $OUT
          import json, traceback
          try:
              from tools.web_tools import _ensure_web_plugins_loaded, _get_search_backend
              _ensure_web_plugins_loaded()
              from agent.web_search_registry import get_provider, get_active_search_provider
              b = _get_search_backend()
              print("backend:", b)
              p = get_provider(b)
              print("get_provider(%r):" % b, type(p).__name__ if p else None)
              print("supports_search:", p.supports_search() if p else "n/a")
              act = get_active_search_provider()
              print("active provider:", type(act).__name__ if act else None, "| name:", getattr(act, "name", None))
              from tools.web_tools import _memoized_search
              if p is not None and p.supports_search():
                  res = _memoized_search(p, "python asyncio", 3)
                  web = (res.get("data") or {}).get("web") or []
                  print("_memoized_search hasil:", len(web), "| success:", res.get("success"), "| error:", res.get("error"))
          except Exception as e:
              print("DIAG GAGAL:", type(e).__name__, str(e)[:300]); traceback.print_exc()
          PYEOF

          echo "--- 2. plugin ddgs terus ---" >> $OUT
          timeout 60 "$PY" - >> $OUT 2>&1 <<'PYEOF' || echo "EXIT=$?" >> $OUT
          try:
              from plugins.web.ddgs.provider import DDGSWebSearchProvider
              p = DDGSWebSearchProvider()
              res = p.search("python asyncio", 3)
              print("ddgs OK, hasil:", len(res))
          except Exception as e:
              print("ddgs GAGAL:", type(e).__name__, str(e)[:300])
          PYEOF

          echo "--- 3. curl keluar ---" >> $OUT
          curl -s -o /dev/null -w "example.com HTTP %{http_code}\n" -m 20 https://example.com >> $OUT 2>&1 || echo "curl gagal" >> $OUT
          curl -s -o /dev/null -w "duckduckgo HTTP %{http_code}\n" -m 20 "https://html.duckduckgo.com/html/?q=test" >> $OUT 2>&1 || echo "ddg gagal" >> $OUT

          echo "--- 4. kadar kejayaan ddgs (5 cubaan) ---" >> $OUT
          timeout 200 "$PY" - >> $OUT 2>&1 <<'PYEOF' || echo "EXIT=$?" >> $OUT
          import time
          from tools.web_tools import _ensure_web_plugins_loaded, _get_search_backend, _memoized_search
          from agent.web_search_registry import get_provider, get_active_search_provider
          _ensure_web_plugins_loaded()
          b = _get_search_backend()
          ok = 0
          for i in range(5):
              q = "test query %d %d" % (i, int(time.time()) % 100000)
              try:
                  p = get_provider(b) or get_active_search_provider()
                  res = _memoized_search(p, q, 3)
                  n = len((res.get("data") or {}).get("web") or [])
              except Exception as e:
                  n = 0
                  print("  cubaan %d: EXC %s" % (i + 1, str(e)[:80]))
              print("  cubaan %d: hasil=%d success=%s" % (i + 1, n, res.get("success") if 'res' in dir() else '?'))
              if n > 0:
                  ok += 1
              time.sleep(2)
          print("KADAR: %d/5" % ok)
          PYEOF

          echo "=== SELESAI ===" >> $OUT
          cat $OUT

          git fetch origin master -q >/dev/null 2>&1 || true
          git checkout -q -B alat-tmp origin/master >/dev/null 2>&1 || true
          cp $OUT alat_verdict.tmp && mv alat_verdict.tmp alat_verdict.txt
          git add -f alat_verdict.txt >/dev/null 2>&1
          git -c user.email=bot@local -c user.name=bot commit -qm "alat verdict" >/dev/null 2>&1 || true
          for p in 1 2 3 4 5; do
            git push origin HEAD:master >/dev/null 2>&1 && break
            sleep $((3 + p * 2))
          done || true

      - name: Tulis .env
        run: |
          cat > home/.env <<'EOF'
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_USERS=8043910371
          MISTRAL_API_KEY=${{ secrets.MISTRAL_API_KEY }}
          GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
          BOZ_PAT=${{ secrets.BOZ_PAT }}
          ROUTER9_API_KEY=${{ secrets.ROUTER9_API_KEY }}
          BOZ_USER=Solelyy4
          EOF
          sed -i 's/^ *//' home/.env

      - name: Sahkan Python + toolkit (venv Hermes, BUKAN python3 sistem)
        run: |
          # FALSE-NEGATIVE LAMA: langkah diagnosa mencari venv dengan laluan tegar
          # ($HOME/.local/share/hermes/venv) yang TIDAK wujud di runner, lalu jatuh ke
          # python3 SISTEM — yang tiada httpx/pyyaml. Hasilnya 3/3 model dilaporkan MATI
          # walaupun ia hidup. Cari venv cara yang sama seperti langkah gateway, dan
          # gagal KETARA kalau tiada supaya kita tidak buta.
          PY=""
          for cand in "$PWD"/home/installs/*/environments/*/venv/bin/python; do
            [ -x "$cand" ] || continue
            if "$cand" -c "import hermes_cli" 2>/dev/null; then PY="$cand"; break; fi
          done
          if [ -z "$PY" ]; then echo "::error::venv Hermes tidak dijumpai"; exit 1; fi
          echo "PY=$PY" >> "$GITHUB_ENV"
          echo "python untuk diagnosa: $PY"
          "$PY" -c "import httpx, yaml; print('httpx', httpx.__version__, '| yaml OK')" \
            || { echo "::warning::pasang httpx+pyyaml ke venv"; "$PY" -m pip install --quiet httpx pyyaml; }
          # Toolkit pengambilan data BOZ minta (YouTube/TikTok/IG/Threads/Google)
          for m in ddgs requests; do
            "$PY" -c "import $m" 2>/dev/null || "$PY" -m pip install --quiet "$m" || true
          done
          echo "=== toolkit sedia ==="
          "$PY" -c "import ddgs, requests; print('ddgs OK, requests OK')"

      - name: Sahkan config terpakai
        run: |
          echo "=== KUNCI API (gagal KETARA, bukan senyap) ==="
          # Bukti keperluan: trace 2026-11-06 tunjuk bot mati dengan
          # 'named custom provider groq has no resolvable api_key' + 14x HTTP 400
          # 'reasoning_effort is not enabled'. Kunci kosong = bot MUSTAHIL berfungsi,
          # tetapi ia gagal SENYAP (bot nampak hidup, mesej BOZ tidak dijawab).
          # Sahkan panjang kunci di sini supaya kegagalan kelihatan dalam log run.
          for K in MISTRAL_API_KEY GROQ_API_KEY TELEGRAM_BOT_TOKEN; do
            V=$(grep -m1 "^$K=" home/.env 2>/dev/null | cut -d= -f2-)
            if [ -z "$V" ]; then echo "::error::$K KOSONG dalam home/.env — bot akan gagal"; exit 1; fi
            if [ "${#V}" -lt 20 ]; then echo "::error::$K terlalu pendek (${#V} aksara) — mungkin rosak"; exit 1; fi
            echo "  $K ada (${#V} aksara, mula ${V:0:6}...)"
          done
          # reasoning_effort pada model kecil = 14x HTTP 400 -> giliran mati.
          # NILAI YANG BETUL ialah `reasoning_effort: false`, BUKAN membuang kunci:
          # Hermes baca nilai ini untuk TAHU ini bukan model reasoning, jadi ia tidak
          # menghantar parameter itu ke API. Membuang kunci sahaja meninggalkan None,
          # yang Hermes anggap "tidak dinyatakan" dan ia hantar nilai lalai -> 400.
          # GUARD BARU (7 Nov 2026): `false` ialah PENYAKIT, bukan ubat.
          # Kod `plugins/model-providers/custom/__init__.py` baris 73-81 memetakan
          # reasoning_effort=false -> top-level reasoning_effort="none" MELAINKAN Groq
          # hanya terima low/medium/high (ujian live: none->400, default->400,
          # low->200, medium->200, TIADA parameter->200). Jadi nilai selamat = null.
          if grep -qE '^\s*reasoning_effort:\s*(false|no|none)\s*$' home/config.yaml; then
            echo "::error::reasoning_effort=false DITEMUI — ini mematikan bot (HTTP 400 pada setiap panggilan). Guna null."
            exit 1
          elif grep -qE '^\s*reasoning_effort:\s*(low|medium|high)\s*$' home/config.yaml; then
            echo "  reasoning_effort=<level> — Groq terima low/medium/high, TETAPI ministral akan 400."
            echo "::warning::level berperingkat pecah pada Mistral — lebih baik null"
          elif grep -qE '^\s*reasoning_effort:\s*null\s*$' home/config.yaml; then
            echo "  reasoning_effort=null (BETUL — tiada parameter dihantar, jalan pada Groq DAN Mistral)"
          else
            echo "  reasoning_effort TIADA dalam config (juga selamat — tiada parameter dihantar)"
          fi

      - name: Diagnosa rantaian bot (model + rangkaian)
        run: |
          echo "=== DIAGNOSA RANTAIAN BOT ==="
          # Bukti keperluan: bot pernah mati dengan 'rebuilt_restart_limit_exceeded'
          # kerana rantaian model gagal (400 reasoning_effort, 401 kunci) dan Hermes
          # mengulang fallback sampai had. Langkah ini membuktikan SETIAP pautan
          # (DNS, TCP, API Telegram, setiap model) hidup SEBELUM gateway mula, jadi
          # kegagalan kelihatan di sini, bukan sebagai mesej pelik kepada BOZ.
          PY=""
          for cand in "$HOME/.local/share/hermes/venv/bin/python" \
                      "$HOME/.hermes/venv/bin/python" \
                      "$(ls -d "$HOME"/.local/share/hermes/*/venv/bin/python 2>/dev/null | head -1)" \
                      "$(find "$HOME" -maxdepth 6 -path '*/hermes*/venv/bin/python' 2>/dev/null | head -1)"; do
            if [ -n "$cand" ] && [ -x "$cand" ]; then PY="$cand"; break; fi
          done
          [ -n "$PY" ] || PY="$(command -v python3)"
          "$PY" -m pip install --quiet httpx pyyaml 2>/dev/null || true
          set -a; . home/.env 2>/dev/null || true; set +a
          export HERMES_CONFIG="$PWD/home/config.yaml"
          # Tulis JSON ke LUAR repo: `git checkout -B` dalam langkah lain memusnahkan
          # fail tidak dijejak, jadi JSON dalam repo HILANG sebelum sempat disalin.
          export DIAGNOSA_OUT="/tmp/diagnosa_bot.json"
          "$PY" scripts/diagnosa_bot.py 2>&1 | tee -a gw.log || \
            echo "::warning::diagnosa ada kegagalan — lihat baris GAGAL di atas"
          # Simpan salinan dalam repo juga (untuk langkah hantar log) dan di /tmp.
          cp /tmp/diagnosa_bot.json diagnosa_bot.json 2>/dev/null || true
          cp /tmp/diagnosa_bot.json /tmp/diagnosa_akhir.json 2>/dev/null || true

      - name: Sahkan toolkit cari (fetch2.py) berfungsi
        run: |
          echo "=== TOOLKIT PENGAMBIL DATA (BOZ minta: YouTube/TikTok/Threads/IG/Google) ==="
          # Bukti: BOZ minta bot boleh ambil apa sahaja dari semua platform. Langkah ini
          # membuktikan toolkit itu BENAR-BENAR ada dan jalan dalam run, bukan sekadar
          # ditulis. Kegagalan di sini = bot akan mengaku "tidak boleh akses" kepada BOZ.
          PY=""
          for cand in "$HOME/.local/share/hermes/venv/bin/python" \
                      "$(find "$HOME" -maxdepth 6 -path '*/hermes*/venv/bin/python' 2>/dev/null | head -1)"; do
            if [ -n "$cand" ] && [ -x "$cand" ]; then PY="$cand"; break; fi
          done
          [ -n "$PY" ] || PY="$(command -v python3)"
          ls -la scripts/fetch2.py
          "$PY" scripts/fetch2.py --platform list
          for P in youtube bing ddg reddit; do
            echo "--- uji $P ---"
            timeout 120 "$PY" scripts/fetch2.py --platform "$P" "malaysia" --kira 2 2>&1 | head -3 || \
              echo "  [$P] gagal kali ini (rate-limit?) — bukan ralat maut"
          done


      - name: Kesihatan jambatan laptop (bukti hidup)
        # Tidak kritikal: kalau laptop tidur, bot mesti tetap hidup. Hasil ditulis ke
        # bridge_health.log supaya operator boleh lihat kesihatan otak sekunder.
        continue-on-error: true
        run: |
          export BOZ_PAT="${{ secrets.BOZ_PAT }}"
          PY=""
          for cand in "$HERMES_HOME"/installs/*/environments/*/venv/bin/python; do
            [ -x "$cand" ] && "$cand" -c "import hermes_cli" 2>/dev/null && { PY="$cand"; break; }
          done
          if [ -z "$PY" ]; then echo "venv tiada - probe dilangkau" > bridge_health.log; exit 0; fi
          timeout 240 "$PY" scripts/bridge.py brain "probe kesihatan laptop" --kind probe --wait 150             > bridge_health.log 2>&1 || echo "probe gagal (laptop mungkin tidur)" >> bridge_health.log
          cat bridge_health.log
          git fetch origin master -q >/dev/null 2>&1 || true
          git checkout -q -B health-tmp origin/master 2>/dev/null || true
          git add -f bridge_health.log >/dev/null 2>&1
          git -c user.email=bot@local -c user.name=bot commit -qm "kesihatan jambatan $(date -u +%FT%TZ)" >/dev/null 2>&1 || true
          for p in 1 2 3; do git push origin HEAD:master >/dev/null 2>&1 && break; sleep 4; done || true
          git checkout -q -

      - name: Sapu run queued tersangkut (elak backlog menyekat bot)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.BOZ_PAT }}
        run: |
          # Bukti 7 Nov 2026: run 42379226559 dicipta 13:56Z, masih 'pending' 40 minit
          # kemudian. Setiap repo hanya boleh ada SATU job dalam concurrency group yang
          # sama, jadi run queued lama MENYEKAT bot baharu daripada mula.
          # Sapu run yang menunggu > 25 minit supaya run ini dapat runner.
          echo "=== run queued sekarang ==="
          gh run list --repo "$GITHUB_REPOSITORY" --workflow telegram-hermes \
            --status queued -L 20 --json databaseId,createdAt \
            --jq '.[]|"\(.databaseId) \(.createdAt)"' 2>/dev/null || true
          # Skrip berasingan: kod python TIDAK boleh ditulis terus dalam blok run: |
          # kerana baris pada kolum 0 memecahkan parser YAML workflow.
          python3 scripts/sapu_queued.py

      - name: AUDIT — hantar 6 mesej BOZ sebenar & rakam balasan
        # MENGAPA: interaksi.py ada dalam repo tetapi TIDAK PERNAH dipanggil workflow
        # (0 rujukan) — jadi tiada bukti bot benar-benar MEMBALAS. Langkah ini menghantar
        # 6 jenis mesej yang BOZ biasa hantar, tunggu bot mengambil setiap satu, dan
        # menyimpan transkrip sebagai bukti di repo.
        if: always()
        continue-on-error: true
        timeout-minutes: 20
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          BOZ_CHAT_ID: "8043910371"
          INTERAKSI_OUT: "/tmp/interaksi.json"
        run: |
          # Tunggu gateway benar-benar hidup (max 12 minit)
          for i in $(seq 1 72); do
            sleep 10
            if grep -q "Connected to Telegram" gw.log 2>/dev/null; then
              echo "gateway hidup selepas $((i*10))s"; break
            fi
          done
          PY=""
          for cand in "$HERMES_HOME"/installs/*/environments/*/venv/bin/python; do
            [ -x "$cand" ] && PY="$cand" && break
          done
          [ -n "$PY" ] || PY="$(command -v python3)"
          echo "python ujian: $PY"
          "$PY" -m pip install --quiet httpx 2>/dev/null || true

          echo "=== UJIAN BERDEPAN: 6 mesej ==="
          "$PY" scripts/interaksi.py --siri 2>&1 | tee -a gw.log || echo "uji interaksi gagal"

          # Kumpul bukti: [JEJAK] mesej masuk + ralat 400/401/429
          {
            echo "=== LAPORAN UJIAN BERDEPAN $(date -u +%FT%TZ) run $GITHUB_RUN_ID ==="
            echo "--- transkrip interaksi ---"
            cat /tmp/interaksi.json 2>/dev/null || echo "tiada transkrip"
            echo
            echo "--- [JEJAK] mesej masuk ke adapter ---"
            grep -n "\[JEJAK\]" gw.log 2>/dev/null | tail -40 || echo "tiada JEJAK"
            echo
            echo "--- ralat model/rangkaian (400/401/429/traceback) ---"
            grep -inE "HTTP [45][0-9][0-9]|must be one of|rate_limited|Traceback|refus" gw.log 2>/dev/null | tail -30 || echo "tiada ralat"
            echo
            echo "--- bukti balasan dihantar (sendMessage/response) ---"
            grep -inE "sendMessage|Sent message|reply|balas" gw.log 2>/dev/null | tail -20 || echo "tiada"
            echo
            echo "--- denyut & FD ---"
            grep -n "denyut" gw.log 2>/dev/null | tail -5 || echo "tiada denyut lagi"
          } > ujian-berdepan.log

          echo "=== laporan ditulis: $(wc -l < ujian-berdepan.log) baris ==="
          for p in 1 2 3; do
            git fetch origin master -q >/dev/null 2>&1 || true
            git rebase --abort >/dev/null 2>&1 || true
            git checkout -q -B ujian-tmp origin/master 2>/dev/null || true
            git add -f ujian-berdepan.log >/dev/null 2>&1
            git -c user.email=bot@local -c user.name=bot commit -qm "bukti ujian berdepan $(date -u +%FT%TZ)" >/dev/null 2>&1 || true
            if git push origin HEAD:master >/dev/null 2>&1; then echo "push bukti ok"; break; fi
            sleep 5
          done

      - name: TUNGGU Telegram bebas (elak polling conflict -> bot PARKED)
        # BUKTI: gw_trace.log run 42390907300 menunjukkan "Telegram polling conflict
        # (1/5)..(5/5)" diikuti "telegram is PARKED after a non-retryable error".
        # Setiap restart mencetuskan ini kerana sesi LAMA masih memegang long-poll
        # selama ~2-4 minit. Tanpa langkah ini, bot baharu masuk, berlanggar 5x
        # (200s), menyerah, dan KEKAL BISU sehingga restart seterusnya.
        # Langkah ini menunggu sehingga Telegram benar-benar bebas sebelum mula.
        timeout-minutes: 12
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          echo "=== MENUNGGU TELEGRAM BEBAS ==="
          for i in $(seq 1 48); do
            # getUpdates TANPA offset: kalau 409, masih ada pemegang long-poll lama.
            RESP=$(curl -4 -s -m 15 "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getUpdates?limit=1&timeout=0" 2>/dev/null)
            if echo "$RESP" | grep -q '"ok":true'; then
              echo "  percubaan $i: Telegram BEBAS — teruskan"
              exit 0
            fi
            if echo "$RESP" | grep -q '409'; then
              # 409 = conflict (pemegang lama). Beri masa, jangan cetuskan kekacauan.
              echo "  percubaan $i: masih ada pemegang (409) — tunggu 15s"
            else
              echo "  percubaan $i: jawapan tidak dijangka: $(echo "$RESP" | head -c 120)"
            fi
            sleep 15
          done
          echo "AMARAN: Telegram tidak bebas selepas 12 minit — cuba juga (gateway akan retry sendiri)"

      - name: Jalankan gateway (kukuh terhadap 409)
        timeout-minutes: 1450
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ROUTER9_API_KEY: ${{ secrets.ROUTER9_API_KEY }}
          BOZ_PAT: ${{ secrets.BOZ_PAT }}
        run: |
          # Logik dipindah ke scripts/gateway_run.sh: GitHub had 21,000 aksara
          # setiap blok run:, dan blok ini telah membesar kepada 24,760 aksara
          # -> SELURUH workflow ditolak ("Invalid workflow file").
          chmod +x scripts/gateway_run.sh
          bash scripts/gateway_run.sh
      - name: Hantar log akhir ke repo
        if: always()
        run: |
          # PEPIJAT LAMA (2026-11-06): `git checkout -B status-tmp origin/master`
          # MEMUSNAHKAN gw.log (fail tidak dijejak) SEBELUM `tail gw.log` dijalankan.
          # Akibatnya status.log sentiasa kosong (hanya baris pengepala), jadi
          # mustahil untuk lihat sama ada bot benar-benar memproses mesej BOZ.
          # PEMBETULAN: SELAMATKAN log ke fail sementara DI LUAR repo dahulu.
          cp gw.log /tmp/gw_akhir.log 2>/dev/null || echo "tiada gw.log" > /tmp/gw_akhir.log
          cp uji-bot.log /tmp/uji_akhir.log 2>/dev/null || true
          cp diagnosa_bot.json /tmp/diagnosa_akhir.json 2>/dev/null || true
          echo "log diselamatkan: $(wc -l < /tmp/gw_akhir.log) baris gw.log"
          for p in 1 2 3; do
            git fetch origin master -q >/dev/null 2>&1 || true
            git rebase --abort >/dev/null 2>&1 || true
            git checkout -q -B status-tmp origin/master >/dev/null 2>&1 || true
            {
              echo "=== run $GITHUB_RUN_ID AKHIR $(date -u +%FT%TZ) ==="
              echo "=== gw.log (300 baris terakhir) ==="
              tail -n 300 /tmp/gw_akhir.log 2>/dev/null || echo "tiada"
              echo
              echo "=== uji-bot.log (jika ada) ==="
              tail -n 60 /tmp/uji_akhir.log 2>/dev/null || echo "tiada"
              echo
              echo "=== diagnosa_bot.json (jika ada) ==="
              cat /tmp/diagnosa_akhir.json 2>/dev/null || echo "tiada"
            } > status.log
            git add -f status.log
            git -c user.email=bot@local -c user.name=bot commit -qm "status akhir $(date -u +%FT%TZ)" || true
            if git push origin HEAD:master >/dev/null 2>&1; then echo "push ok"; break; fi
            sleep 5
          done

      - name: Simpan state ke repo peribadi
        if: always()
        run: |
          cd home
          git config user.email bot@local
          git config user.name boz-bot
          rm -f .env
          git add -A
          git commit -m "state $(date -u +%FT%TZ)" || echo "tiada perubahan"
          for p in 1 2 3; do
            git pull --rebase --autostash -q >/dev/null 2>&1 || git rebase --abort >/dev/null 2>&1 || true
            if git push origin HEAD:master >/dev/null 2>&1; then echo "state push ok"; break; fi
            sleep 5
          done
