name: telegram-hermes

on:
  schedule:
    - cron: "7 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: telegram-hermes
  cancel-in-progress: false

jobs:
  jalankan:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ambil home Hermes (repo peribadi)
        run: |
          git clone --depth 1 "https://x-access-token:${{ secrets.BOZ_PAT }}@github.com/Solelyy4/boz-hermes-home.git" home
          ls home

      - name: Pasang Hermes
        run: |
          python -m pip install -U pip wheel >/dev/null
          pip install --quiet hermes-agent 2>&1 | tail -3
          which hermes || python -m hermes_cli --version || true

      - name: Tulis .env
        run: |
          cat > home/.env <<'EOF'
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_USERS=8043910371
          MISTRAL_API_KEY=${{ secrets.MISTRAL_API_KEY }}
          EOF
          sed -i 's/^ *//' home/.env

      - name: Jalankan gateway + lapor status
        timeout-minutes: 330
        continue-on-error: true
        run: |
          export HERMES_HOME="$PWD/home"
          export HERMES_NO_UPDATE_CHECK=1
          hermes gateway run > gw.log 2>&1 &
          PID=$!
          for i in $(seq 1 36); do
            sleep 5
            if grep -qiE "telegram" gw.log; then break; fi
            kill -0 $PID 2>/dev/null || break
          done
          tail -60 gw.log
          cp gw.log status.log
          git add status.log && git -c user.email=bot@local -c user.name=bot commit -qm "status awal" || true
          git push || true
          wait $PID || true
          tail -60 gw.log

      - name: Hantar log akhir ke repo
        if: always()
        run: |
          cp gw.log status.log 2>/dev/null || echo "tiada gw.log" > status.log
          git add status.log && git -c user.email=bot@local -c user.name=bot commit -qm "status akhir $(date -u +%FT%TZ)" || true
          git push || true

      - name: Simpan state ke repo peribadi
        if: always()
        run: |
          cd home
          git config user.email bot@local
          git config user.name boz-bot
          rm -f .env
          git add -A
          git commit -m "state $(date -u +%FT%TZ)" || echo "tiada perubahan"
          git push origin HEAD:master || echo "push gagal"
